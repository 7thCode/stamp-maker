name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Existing release tag to upload built assets to (optional; leave empty to just upload workflow artifacts)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: 7thCode/actions-templates/.github/workflows/multiplatform-release.yml@main
    with:
      # 画像生成が macOS(Metal)専用のため、macOS のみビルドする
      os_matrix: '["macos-latest"]'
      # sd-cli(画像生成エンジン)をビルドして同梱する。モデルは同梱せず、アプリが初回起動時にダウンロードする
      build_command: scripts/build-sdcli.sh build/sdcpp/bin/sd-cli && npm run typecheck && npm test && npm run build
      artifact_globs: dist/*.dmg
      upload_to_release_tag: ${{ inputs.upload_to_release }}
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
