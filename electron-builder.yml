appId: local.stampmaker.app
productName: StampMaker
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
# CI・配布用の既定構成(モデルは同梱しない)。モデル込みは electron-builder.bundled.yml
mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch: arm64
  # Apple Silicon では署名が不整合だと「壊れている」と表示されるため、証明書なしの簡易署名(ad-hoc)で全体に署名する
  identity: '-'
  # 簡易署名では Hardened Runtime を使うと、ライブラリ検証で起動に失敗するため無効にする
  hardenedRuntime: false
